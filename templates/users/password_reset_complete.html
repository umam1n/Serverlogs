{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md text-center">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">✅ Password Reset Complete</h2>
    <p class="text-gray-600">
        Your password has been successfully set. You can now log in with your new password.
    </p>
    <div class="mt-6">
        <a href="{% url 'login' %}" class="w-full inline-block bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700">
            Log In
        </a>
    </div>
</div>
{% endblock %}
