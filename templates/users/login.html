{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div class="bg-white py-10 px-8 rounded-2xl shadow-md sm:px-10">
      <div class="text-center">
        <h2 class="text-3xl font-extrabold text-gray-900">Welcome Back</h2>
        <p class="mt-2 text-sm text-gray-500">Sign in to your account</p>
      </div>
      
      <form method="post" class="mt-8 space-y-6">
        {% csrf_token %}
        {{ form|crispy }}
        <div>
          <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-xl text-white bg-blue-600 hover:bg-blue-700 focus:outline-none transition duration-300 ease-in-out">
            Sign In
          </button>
        </div>
      </form>

      <div class="mt-6 text-sm text-center text-gray-600 space-y-2">
        <p>
          Don’t have an account?
          <a href="{% url 'register' %}" class="font-semibold text-blue-600 hover:underline">
            Register here
          </a>
        </p>
        <p>
          <a href="{% url 'password_reset' %}" class="font-medium text-blue-600 hover:text-blue-500">
            Forgot your password?
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
